server.port=8080

# Hibernate / JPA
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
 
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwtSecret=${JWT_SECRET:dev-secret}
app.jwtExpirationMs=86400000

# CORS -- comma-separated list, ρυθμίζεται μέσω env var CORS_ALLOWED_ORIGINS
app.cors.allowedOrigins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Spring profile
spring.profiles.active=dev

# Dev admin seed
app.seed.admin.username=${ADMIN_USERNAME:admin1}
app.seed.admin.email=${ADMIN_EMAIL:admin1@example.com}
app.seed.admin.password=${ADMIN_PASSWORD:admin123}

# OpenAPI
springdoc.api-docs.path=/api-docs

# Mail configuration
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:test@localhost}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
